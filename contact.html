<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

</head>
<link rel="stylesheet" href="style.css">
<body>
  <nav class="navbar">
  <span class="logo">WED DEVELOPER</span>
  <div class="logo">
 <a href="index.html" class="nav-link">Home</a>
  <a href="about.html" class="nav-link">About</a>
  <a href="projects.html" class="nav-link">Projects</a>
  <a href="contact.html" class="nav-link active">Contact</a>
  </div>
</nav>   
<section id="contact">
  <h2>Contact Me</h2>
  <form id="contactForm">
    <label for="name">Name</label>
    <input type="text" id="name" name="name" required minlength="2">
 
    <label for="email">Email</label>
    <input type="email" id="email" name="email" required placeholder="you@example.com">
 
    <label for="topic">Topic</label>
    <select id="topic" name="topic">
      <option value="general">General question</option>
      <option value="project">Project idea</option>
      <option value="feedback">Feedback</option>
    </select>

  <fieldset>
      <legend>Preferred reply</legend>
      <input type="radio" id="reply-email" name="reply" value="email">
      <label for="reply-email">Email</label>
      <input type="radio" id="reply-phone" name="reply" value="phone">
      <label for="reply-phone">Phone</label>
    </fieldset>

    <label for="message">Message</label>
    <textarea id="message" name="message" rows="4" required></textarea>
 
    <button type="submit">Send</button>
  </form>
  <p id="formMessage" role="status"></p>
</section>
 <script src="script.js"></script>
</body>
</html>
